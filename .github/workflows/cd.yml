name: CD - Deploy Agent to Environments

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy and Evaluate DEV
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: support-agent-dev
      cancel-in-progress: false
    outputs:
      agent_id: ${{ steps.agent.outputs.agent-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extension
        run: azd ext install microsoft.foundry

      - name: Verify Foundry extension
        run: |
          set -euo pipefail
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure DEV environment
        id: dev-config
        shell: bash
        run: |
          set -euo pipefail
          config="config/dev.json"
          azd_env="$(jq -r '.azdEnvironment' "$config")"

          azd env select "$azd_env" || azd env new "$azd_env" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$(jq -r '.location' "$config")"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(jq -r '.projectEndpoint' "$config")"
          azd env set AZURE_AI_PROJECT_ID "$(jq -r '.projectResourceId' "$config")"
          azd env set FOUNDRY_MODEL_NAME "$(jq -r '.modelDeployment' "$config")"
          azd env set TOOLBOX_NAME "$(jq -r '.toolboxName' "$config")"
          azd env get-values
          echo "project-endpoint=$(jq -r '.projectEndpoint' "$config")" >> "$GITHUB_OUTPUT"
          echo "evaluation-model=$(jq -r '.evaluationModelDeployment' "$config")" >> "$GITHUB_OUTPUT"

      - name: Deploy hosted agent to DEV
        run: azd deploy support-agent-dev --no-prompt

      - name: Show DEV agent status
        run: azd ai agent show support-agent-dev --no-prompt --output json

      - name: Smoke test DEV
        run: |
          agent_endpoint="$(azd env get-value AGENT_SUPPORT_AGENT_DEV_RESPONSES_ENDPOINT)"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/agent-response.txt \
            "" \
            "Without calling tools, briefly state the two operational modes you support." \
            "$agent_endpoint"

      - name: Smoke test DEV ServiceNow mock
        run: |
          agent_endpoint="$(azd env get-value AGENT_SUPPORT_AGENT_DEV_RESPONSES_ENDPOINT)"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/servicenow-response.txt \
            "SERVICENOW_MOCK_OK" \
            "Handle a request that would normally list ServiceNow incidents. Do not call live systems and confirm the configured mock mode." \
            "$agent_endpoint"

      - name: Resolve DEV agent version
        id: agent
        run: |
          set -euo pipefail
          agent_name="$(azd env get-value AGENT_SUPPORT_AGENT_DEV_NAME)"
          agent_version="$(azd env get-value AGENT_SUPPORT_AGENT_DEV_VERSION)"
          echo "agent-id=${agent_name}:${agent_version}" >> "$GITHUB_OUTPUT"
          echo "DEV candidate: \`${agent_name}:${agent_version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up evaluation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Microsoft Foundry SDK
        run: |
          python -m pip install \
            "azure-ai-projects>=2.4.0,<3.0.0" \
            "azure-identity==1.25.3" \
            "httpx>=0.27.0,<1.0.0"
          python -c "from azure.ai.projects import AIProjectClient; from openai.types.eval_create_params import DataSourceConfigCustom"

      - name: Run DEV Foundry cloud evaluation
        run: |
          python scripts/run_eval_gate.py cloud \
            --project-endpoint "${{ steps.dev-config.outputs.project-endpoint }}" \
            --model-deployment "${{ steps.dev-config.outputs.evaluation-model }}" \
            --agent-id "${{ steps.agent.outputs.agent-id }}" \
            --dataset evals/release.json \
            --dataset-version "${{ github.run_id }}-${{ github.run_attempt }}" \
            --output evaluation-results/dev-candidate.json \
            --custom-evaluator "support_quality=src/support-agent/evaluators/SupportAgentHosted-smoke/rubric_dimensions.json" \
            --custom-evaluator "joke_instruction=src/support-agent/evaluators/joke_instruction/rubric_dimensions.json"

      - name: Enforce DEV evaluation thresholds
        run: |
          python scripts/run_eval_gate.py enforce \
            --thresholds evals/thresholds.json \
            --output evaluation-results/dev-candidate.json

      - name: Upload evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-evaluation-${{ github.sha }}
          path: evaluation-results/dev-candidate.json
          if-no-files-found: error

  resolve-prod-slots:
    name: Resolve PROD deployment order
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - deploy-dev
    runs-on: ubuntu-latest
    outputs:
      candidate_slot: ${{ steps.slots.outputs.candidate_slot }}
      secondary_slot: ${{ steps.slots.outputs.secondary_slot }}

    steps:
      - name: Checkout evaluated commit
        uses: actions/checkout@v4

      - name: Resolve deployment slots
        id: slots
        shell: bash
        run: |
          set -euo pipefail
          candidate_slot="$(jq -r '.candidateSlot' config/prod.json)"

          case "$candidate_slot" in
            blue) secondary_slot="green" ;;
            green) secondary_slot="blue" ;;
            *)
              echo "::error::config/prod.json candidateSlot must be blue or green."
              exit 1
              ;;
          esac

          echo "candidate_slot=$candidate_slot" >> "$GITHUB_OUTPUT"
          echo "secondary_slot=$secondary_slot" >> "$GITHUB_OUTPUT"
          {
            echo "## PROD deployment order"
            echo
            echo "1. Candidate: \`$candidate_slot\`"
            echo "2. Secondary: \`$secondary_slot\`"
            echo
            echo "Each slot requires a separate approval on the protected \`prod\` environment."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod-candidate:
    name: Deploy PROD candidate
    needs:
      - deploy-dev
      - resolve-prod-slots
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: support-agent-prod
      cancel-in-progress: false
    outputs:
      agent_name: ${{ steps.prod-agent.outputs.agent_name }}
      agent_version: ${{ steps.prod-agent.outputs.agent_version }}
      agent_endpoint: ${{ steps.prod-agent.outputs.agent_endpoint }}

    steps:
      - name: Checkout evaluated commit
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extension
        run: azd ext install microsoft.foundry

      - name: Verify Foundry extension
        run: |
          set -euo pipefail
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure PROD environment
        shell: bash
        run: |
          set -euo pipefail
          config="config/prod.json"
          azd_env="$(jq -r '.azdEnvironment' "$config")"

          azd env select "$azd_env" || azd env new "$azd_env" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$(jq -r '.location' "$config")"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(jq -r '.projectEndpoint' "$config")"
          azd env set AZURE_AI_PROJECT_ID "$(jq -r '.projectResourceId' "$config")"
          azd env set FOUNDRY_MODEL_NAME "$(jq -r '.modelDeployment' "$config")"
          azd env set TOOLBOX_NAME "$(jq -r '.toolboxName' "$config")"
          azd env get-values

      - name: Deploy candidate slot
        run: >-
          azd deploy
          "support-agent-${{ needs.resolve-prod-slots.outputs.candidate_slot }}"
          --no-prompt

      - name: Show candidate status
        run: >-
          azd ai agent show
          "support-agent-${{ needs.resolve-prod-slots.outputs.candidate_slot }}"
          --no-prompt
          --output json

      - name: Smoke test candidate
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.candidate_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/agent-response.txt \
            "" \
            "Without calling tools, briefly state the two operational modes you support." \
            "$agent_endpoint"

      - name: Smoke test candidate ServiceNow mock
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.candidate_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/servicenow-response.txt \
            "SERVICENOW_MOCK_OK" \
            "Handle a request that would normally list ServiceNow incidents. Do not call live systems and confirm the configured mock mode." \
            "$agent_endpoint"

      - name: Record candidate
        id: prod-agent
        shell: bash
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.candidate_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_name="$(azd env get-value "${env_prefix}_NAME")"
          agent_version="$(azd env get-value "${env_prefix}_VERSION")"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"

          echo "agent_name=$agent_name" >> "$GITHUB_OUTPUT"
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "agent_endpoint=$agent_endpoint" >> "$GITHUB_OUTPUT"
          {
            echo "## PROD candidate passed"
            echo
            echo "- Slot: \`$slot\`"
            echo "- Agent: \`${agent_name}:${agent_version}\`"
            echo "- Responses endpoint: \`${agent_endpoint}\`"
            echo
            echo "Approve the secondary PROD deployment to update the other slot."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod-secondary:
    name: Deploy PROD secondary
    needs:
      - deploy-dev
      - resolve-prod-slots
      - deploy-prod-candidate
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: support-agent-prod
      cancel-in-progress: false

    steps:
      - name: Checkout evaluated commit
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extension
        run: azd ext install microsoft.foundry

      - name: Verify Foundry extension
        run: |
          set -euo pipefail
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure PROD environment
        shell: bash
        run: |
          set -euo pipefail
          config="config/prod.json"
          azd_env="$(jq -r '.azdEnvironment' "$config")"

          azd env select "$azd_env" || azd env new "$azd_env" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$(jq -r '.location' "$config")"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(jq -r '.projectEndpoint' "$config")"
          azd env set AZURE_AI_PROJECT_ID "$(jq -r '.projectResourceId' "$config")"
          azd env set FOUNDRY_MODEL_NAME "$(jq -r '.modelDeployment' "$config")"
          azd env set TOOLBOX_NAME "$(jq -r '.toolboxName' "$config")"
          azd env get-values

      - name: Deploy secondary slot
        run: >-
          azd deploy
          "support-agent-${{ needs.resolve-prod-slots.outputs.secondary_slot }}"
          --no-prompt

      - name: Show secondary status
        run: >-
          azd ai agent show
          "support-agent-${{ needs.resolve-prod-slots.outputs.secondary_slot }}"
          --no-prompt
          --output json

      - name: Smoke test secondary
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.secondary_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/agent-response.txt \
            "" \
            "Without calling tools, briefly state the two operational modes you support." \
            "$agent_endpoint"

      - name: Smoke test secondary ServiceNow mock
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.secondary_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/servicenow-response.txt \
            "SERVICENOW_MOCK_OK" \
            "Handle a request that would normally list ServiceNow incidents. Do not call live systems and confirm the configured mock mode." \
            "$agent_endpoint"

      - name: Record completed PROD release
        shell: bash
        run: |
          set -euo pipefail
          slot="${{ needs.resolve-prod-slots.outputs.secondary_slot }}"
          env_prefix="AGENT_SUPPORT_AGENT_${slot^^}"
          agent_name="$(azd env get-value "${env_prefix}_NAME")"
          agent_version="$(azd env get-value "${env_prefix}_VERSION")"
          agent_endpoint="$(azd env get-value "${env_prefix}_RESPONSES_ENDPOINT")"

          {
            echo "## Both PROD slots passed"
            echo
            echo "| Order | Slot | Agent | Responses endpoint |"
            echo "|---|---|---|---|"
            echo "| Candidate | \`${{ needs.resolve-prod-slots.outputs.candidate_slot }}\` | \`${{ needs.deploy-prod-candidate.outputs.agent_name }}:${{ needs.deploy-prod-candidate.outputs.agent_version }}\` | \`${{ needs.deploy-prod-candidate.outputs.agent_endpoint }}\` |"
            echo "| Secondary | \`$slot\` | \`${agent_name}:${agent_version}\` | \`${agent_endpoint}\` |"
            echo
            echo "Both slots run commit \`${{ github.sha }}\` and passed direct smoke tests."
            echo "Update both APIM backend URLs, then change backend-pool weights manually."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record release
        run: |
          echo "Deployed commit \`${{ github.sha }}\` to both PROD slots after two approvals." >> "$GITHUB_STEP_SUMMARY"
          echo "DEV source version: \`${{ needs.deploy-dev.outputs.agent_id }}\`" >> "$GITHUB_STEP_SUMMARY"
