name: CD - Deploy Agent to Environments

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy and Evaluate DEV
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: support-agent-dev
      cancel-in-progress: false
    outputs:
      agent_id: ${{ steps.agent.outputs.agent-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extension
        run: azd ext install microsoft.foundry

      - name: Verify Foundry extension
        run: |
          set -euo pipefail
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure DEV environment
        id: dev-config
        shell: bash
        run: |
          set -euo pipefail
          config="config/dev.json"
          azd_env="$(jq -r '.azdEnvironment' "$config")"

          azd env select "$azd_env" || azd env new "$azd_env" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$(jq -r '.location' "$config")"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(jq -r '.projectEndpoint' "$config")"
          azd env set AZURE_AI_PROJECT_ID "$(jq -r '.projectResourceId' "$config")"
          azd env set FOUNDRY_MODEL_NAME "$(jq -r '.modelDeployment' "$config")"
          azd env set TOOLBOX_NAME "$(jq -r '.toolboxName' "$config")"
          azd env get-values
          echo "project-endpoint=$(jq -r '.projectEndpoint' "$config")" >> "$GITHUB_OUTPUT"
          echo "evaluation-model=$(jq -r '.evaluationModelDeployment' "$config")" >> "$GITHUB_OUTPUT"

      - name: Deploy hosted agent to DEV
        run: azd deploy --no-prompt

      - name: Show DEV agent status
        run: azd ai agent show --no-prompt --output json

      - name: Smoke test DEV
        run: |
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/agent-response.txt \
            "" \
            "Without calling tools, briefly state the two operational modes you support."

      - name: Smoke test DEV ServiceNow connection
        run: |
          bash scripts/invoke_agent_with_retry.sh \
            /tmp/servicenow-response.txt \
            "SERVICENOW_SMOKE_OK" \
            "The verified direct-user identity for this smoke test is smoke-test-user. Call the ServiceNow List Records tool exactly once with tableType set to the lowercase singular value incident. If it succeeds, reply SERVICENOW_SMOKE_OK. Do not create or modify anything."

      - name: Resolve DEV agent version
        id: agent
        run: |
          set -euo pipefail
          agent_name="$(azd env get-value AGENT_SUPPORT_AGENT_NAME)"
          agent_version="$(azd env get-value AGENT_SUPPORT_AGENT_VERSION)"
          echo "agent-id=${agent_name}:${agent_version}" >> "$GITHUB_OUTPUT"
          echo "DEV candidate: \`${agent_name}:${agent_version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up evaluation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Microsoft Foundry SDK
        run: |
          python -m pip install \
            "azure-ai-projects>=2.4.0,<3.0.0" \
            "azure-identity==1.25.3" \
            "httpx>=0.27.0,<1.0.0"
          python -c "from azure.ai.projects import AIProjectClient; from openai.types.eval_create_params import DataSourceConfigCustom"

      - name: Run DEV Foundry cloud evaluation
        run: |
          python scripts/run_eval_gate.py cloud \
            --project-endpoint "${{ steps.dev-config.outputs.project-endpoint }}" \
            --model-deployment "${{ steps.dev-config.outputs.evaluation-model }}" \
            --agent-id "${{ steps.agent.outputs.agent-id }}" \
            --dataset evals/release.json \
            --dataset-version "${{ github.run_id }}-${{ github.run_attempt }}" \
            --output evaluation-results/dev-candidate.json \
            --custom-evaluator "support_quality=src/support-agent/evaluators/SupportAgentHosted-smoke/rubric_dimensions.json" \
            --custom-evaluator "joke_instruction=src/support-agent/evaluators/joke_instruction/rubric_dimensions.json"

      - name: Enforce DEV evaluation thresholds
        run: |
          python scripts/run_eval_gate.py enforce \
            --thresholds evals/thresholds.json \
            --output evaluation-results/dev-candidate.json

      - name: Upload evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-evaluation-${{ github.sha }}
          path: evaluation-results/dev-candidate.json
          if-no-files-found: error

  deploy-prod:
    name: Deploy to PROD
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: support-agent-prod
      cancel-in-progress: false

    steps:
      - name: Checkout evaluated commit
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extension
        run: azd ext install microsoft.foundry

      - name: Verify Foundry extension
        run: |
          set -euo pipefail
          azd ext list | grep -q "microsoft.foundry"
          azd ai agent --help > /dev/null

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure PROD environment
        shell: bash
        run: |
          set -euo pipefail
          config="config/prod.json"
          azd_env="$(jq -r '.azdEnvironment' "$config")"

          azd env select "$azd_env" || azd env new "$azd_env" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$(jq -r '.location' "$config")"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(jq -r '.projectEndpoint' "$config")"
          azd env set AZURE_AI_PROJECT_ID "$(jq -r '.projectResourceId' "$config")"
          azd env set FOUNDRY_MODEL_NAME "$(jq -r '.modelDeployment' "$config")"
          azd env set TOOLBOX_NAME "$(jq -r '.toolboxName' "$config")"
          azd env get-values

      - name: Deploy hosted agent to PROD
        run: azd deploy --no-prompt

      - name: Show PROD agent status
        run: azd ai agent show --no-prompt --output json

      - name: Smoke test PROD
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if azd ai agent invoke \
              "Without calling tools, briefly state the two operational modes you support." \
              --new-session \
              --no-prompt \
              --output raw > /tmp/agent-response.txt &&
              grep -q "event: response.completed" /tmp/agent-response.txt &&
              ! grep -q "event: response.failed" /tmp/agent-response.txt; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          cat /tmp/agent-response.txt
          exit 1

      - name: Smoke test PROD ServiceNow connection
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if azd ai agent invoke \
              "The verified direct-user identity for this smoke test is smoke-test-user. Call the ServiceNow List Records tool exactly once with tableType set to the lowercase singular value incident. If it succeeds, reply SERVICENOW_SMOKE_OK. Do not create or modify anything." \
              --new-session \
              --no-prompt \
              --output raw > /tmp/servicenow-response.txt &&
              grep -q "event: response.completed" /tmp/servicenow-response.txt &&
              ! grep -q "event: response.failed" /tmp/servicenow-response.txt &&
              ! grep -q "Error: Function failed" /tmp/servicenow-response.txt &&
              ! grep -q '"error":{' /tmp/servicenow-response.txt &&
              grep -q "SERVICENOW_SMOKE_OK" /tmp/servicenow-response.txt; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          cat /tmp/servicenow-response.txt
          exit 1

      - name: Record release
        run: |
          echo "Promoted commit \`${{ github.sha }}\` after DEV evaluation." >> "$GITHUB_STEP_SUMMARY"
          echo "DEV source version: \`${{ needs.deploy-dev.outputs.agent_id }}\`" >> "$GITHUB_STEP_SUMMARY"
