# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"

name: support-agent-hosted

services:
  support-agent:
    project: src/support-agent
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Hosted ServiceNow specialist for incident assessment and sales engagement gates.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${FOUNDRY_MODEL_NAME}
      - name: TOOLBOX_NAME
        value: ${TOOLBOX_NAME}
    kind: hosted
    metadata:
      tags:
        - Agent Framework
        - ServiceNow
        - Foundry Toolbox
        - Responses Protocol
    name: SupportAgentHosted
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry
