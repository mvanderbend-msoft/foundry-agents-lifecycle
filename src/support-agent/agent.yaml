# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: SupportAgentHosted
description: Hosted ServiceNow specialist for incident assessment and sales engagement gates.
metadata:
  tags:
    - Agent Framework
    - ServiceNow
    - Foundry Toolbox
    - Responses Protocol
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: "0.5"
  memory: 1Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${FOUNDRY_MODEL_NAME}
  - name: TOOLBOX_NAME
    value: ${TOOLBOX_NAME}
code_configuration:
  runtime: python_3_13
  entry_point: main.py
  dependency_resolution: remote_build
